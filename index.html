<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noise-poster</title>
<meta name="description" content="A page that draws an abstract poster from layered value noise — the seed is in the URL, so any poster comes back, and the PNG export is A4 at 300 DPI.">
<!-- Empty data URI: stops the browser's automatic /favicon.ico request, which
     would otherwise 404 into the console on a cold load. No file, no network. -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<!-- defer: app.js runs before DOMContentLoaded fires, and it does all of its
     work from that event, so no hash parsing happens at module scope. -->
<script src="app.js" defer></script>
</head>
<body>
<!-- Two arrangements live in this one grid: poster over the controls, and
     poster beside them. app.js lays both out on every resize, measures the
     poster each gives and keeps the larger, so there is no breakpoint to be
     wrong about. Source order is masthead, poster, controls in both. -->
<main id="page" class="page lay-stack">
  <header class="masthead">
    <h1>noise-poster</h1>
    <p class="tagline">A poster made of layered noise. The seed is in the link.</p>
  </header>

  <!-- The sheet is drawn before any control is touched. aspect-ratio holds the
       A4 portrait box until app.js sizes the canvas from the space available. -->
  <div class="sheet">
    <canvas id="poster" class="poster" role="img" aria-label="Generated noise poster"></canvas>
  </div>

  <div class="controls">
    <div class="row">
      <div class="field">
        <label for="seed">Seed</label>
        <input id="seed" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <button id="shuffle" type="button">Shuffle</button>
    </div>

    <div class="palette" role="group" aria-labelledby="palette-label">
      <span id="palette-label" class="group-label">Palette</span>
      <div id="swatches" class="swatches"></div>
    </div>

    <button id="download" type="button" class="download">Download PNG</button>
    <p id="export-note" class="export-note" role="status"></p>
  </div>
</main>
</body>
</html>
